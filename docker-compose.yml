services:
  remnawave-shopbot:
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - '1488:1488'
      - '8000:8000'
    volumes:
      - .:/app/project
      - ../remnawave-shopbot-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    container_name: remnawave-shopbot
