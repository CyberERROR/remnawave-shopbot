:root{color-scheme:dark;--bg:#080708;--panel:#141213;--stroke:rgba(255,255,255,.09);--muted:#838183;--text:#f7f5f5;--pink:#ed1647;--pink2:#ff3664;--amber:#ffb523;--green:#6fe5a3;--radius:24px;--font:Inter,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#101012;color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}button{color:inherit;cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}button:disabled{cursor:default;opacity:.45}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:4px}button{transition:background .18s,transform .18s,border-color .18s,box-shadow .18s}button:active:not(:disabled){transform:scale(.97)}button:hover:not(:disabled){filter:brightness(1.1)}svg{display:block;flex-shrink:0}.icon{width:22px;height:22px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}h1,h2,h3,p{margin:0}h1,h2{font-family:Unbounded,Inter,sans-serif;letter-spacing:-1.1px;line-height:1.2}h1{font-size:27px;font-weight:800;margin:2px 2px 22px}h2{font-size:22px;margin-bottom:6px}h3{font-size:16px;font-weight:750;letter-spacing:-.4px}small{font-size:12px}.muted{color:var(--muted)}.pink{color:var(--pink2)}.amber{color:var(--amber)}.green{color:var(--green)}.flex{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.stack{display:flex;flex-direction:column;gap:12px}.grow{flex:1;min-width:0}.center{text-align:center}.spacer{flex:1}.hidden{display:none!important}
.stage{min-height:100vh;display:grid;place-items:center;padding:28px 24px}.phone{position:relative;width:397px;height:min(844px,calc(100dvh - 56px));min-height:650px;overflow:hidden;background:radial-gradient(ellipse 380px 310px at 5% 0%,#291607 0%,transparent 76%),radial-gradient(ellipse 330px 600px at 100% 80%,#13090d 0%,transparent 75%),var(--bg);border:1px solid #292427;border-radius:38px;box-shadow:0 30px 100px #0009}.app{height:100%;display:flex;flex-direction:column;transition:filter .25s,transform .25s}.app.blurred{filter:blur(6px);transform:scale(.985);pointer-events:none}.screen{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:14px 15px 12px;display:flex;flex-direction:column}.screen::-webkit-scrollbar{display:none}.screen.enter{animation:enter .22s ease both}@keyframes enter{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card{border:1px solid var(--stroke);background:linear-gradient(135deg,#ffffff08,#ffffff02);border-radius:var(--radius);box-shadow:inset 0 1px 0 #ffffff04}.button{min-height:56px;border:1px solid var(--stroke);border-radius:30px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:750;font-size:16px;letter-spacing:-.45px;background:#171516;padding:12px 18px}.button.primary{background:linear-gradient(180deg,#ef1648,#d6103f);border-color:#ff526b70;box-shadow:0 10px 26px #ec14451b}.button.secondary{background:#ffffff07}.button.danger{background:#ed16470c;color:var(--pink2);border-color:#e7224b99}.button.small{min-height:46px;font-size:14px;padding:10px 15px}.round{width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:#ffffff09;border:1px solid var(--stroke);flex-shrink:0}.round .icon{width:19px;height:19px}.row{width:100%;text-align:left;display:flex;gap:13px;align-items:center;padding:13px 15px;min-height:64px}.row p{color:var(--muted);font-size:13px;margin-top:2px;line-height:1.35}.row .chevron{width:16px;height:16px;color:#777}.tile-icon{width:40px;height:40px;border-radius:14px;background:#e51a4520;display:grid;place-items:center;color:var(--pink2);flex-shrink:0}.tile-icon .icon{width:20px;height:20px}.tag{font-size:12px;color:var(--pink2);border-radius:20px;padding:5px 10px;background:#f7244c20;font-weight:650;white-space:nowrap}
.brand{font-size:18px;font-weight:750;letter-spacing:-.5px;margin-left:8px}.brand span{color:#fb2454;font-family:monospace;font-weight:500;margin-left:5px}.plan-pill{border:1px solid var(--stroke);border-radius:24px;background:#1b1719;padding:10px 13px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:10px;min-height:42px}.plan-pill .icon{width:15px;height:15px;color:#aaa}.home-head{margin-top:-8px}.subscription{margin:23px auto 0;text-align:center;width:260px;position:relative}.dial{position:relative;width:260px;height:248px}.dial-svg{width:260px;height:248px;overflow:visible}.dial-base{stroke:#ffffff0a;stroke-width:12;fill:none}.dial-track{fill:none;stroke:#ffffff06;stroke-width:1.5;stroke-dasharray:1 6}.dial-progress{fill:none;stroke:url(#gold);stroke-width:12;stroke-linecap:round;transform:rotate(-90deg);transform-origin:130px 124px;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.75,.2,1);filter:drop-shadow(0 0 7px #ffb52322)}.orbit{position:absolute;inset:0;animation:orbit 12s linear infinite}.orbit-dot{position:absolute;left:246px;top:103px;width:7px;height:7px;background:#ffad09;border-radius:50%;box-shadow:0 0 6px #ffb523,0 0 18px #ffb52399}@keyframes orbit{to{transform:rotate(360deg)}}.dial-copy{position:absolute;inset:0;display:flex;align-items:center;flex-direction:column;justify-content:center;padding-top:4px;pointer-events:none}.days{font-family:Dial,Inter,sans-serif;font-size:80px;line-height:1.12;font-weight:750;color:#ffd58b;letter-spacing:-4px;font-variant-numeric:tabular-nums}.days-caption{font-size:15px;font-weight:750;margin-top:17px;letter-spacing:-.5px}.expiry{color:#aaa;font-size:12px;margin-top:5px}.status{display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--amber);font:700 10px/1.3 monospace;letter-spacing:1.7px;border:1px solid #745009;border-radius:20px;padding:8px 12px;background:#ffb00009;margin-top:13px}.status-dot{width:6px;height:6px;border-radius:100%;background:currentColor;box-shadow const storage={get(k,fallback=null){try{const v=localStorage.getItem(k);return v===null?fallback:JSON.parse(v)}catch{return fallback}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},remove(k){try{localStorage.removeItem(k)}catch{}}};
function getAuthToken(){let token='';try{token=localStorage.getItem('auth_token')||''}catch{}if(!token){const match=document.cookie.match(/(?:^|;\s*)auth_token=([^;]*)/);try{token=match?decodeURIComponent(match[1]):''}catch{}}return token}
function setAuthToken(token){try{localStorage.setItem('auth_token',token)}catch{}document.cookie='auth_token='+encodeURIComponent(token)+'; max-age=31536000; path=/; SameSite=Lax'+(location.protocol==='https:'?'; Secure':'')}
function removeAuthToken(){try{localStorage.removeItem('auth_token')}catch{}document.cookie='auth_token=; max-age=0; path=/; SameSite=Lax'}
window.getAuthToken=getAuthToken;window.setAuthToken=setAuthToken;window.removeAuthToken=removeAuthToken;
const tg=window.Telegram?.WebApp;
function haptic(type='light'){try{tg?.HapticFeedback?.impactOccurred(type)}catch{}}
function setupTelegram(){if(!tg)return;try{tg.ready();tg.expand();tg.setHeaderColor('#080708');tg.setBackgroundColor('#080708');if(tg.isVersionAtLeast?.('7.10'))tg.setBottomBarColor?.('#080708');if(tg.isVersionAtLeast?.('7.7'))tg.disableVerticalSwipes?.();if(document.body.classList.contains('tg-fullscreen')&&tg.isVersionAtLeast?.('8.0'))tg.requestFullscreen?.()}catch{}}
function syncViewport(){const actual=window.visualViewport?.height||window.innerHeight;const height=tg?.initData?Math.min(tg.viewportHeight||actual,actual):actual;document.documentElement.style.setProperty('--app-height',height+'px');const inset=tg?.safeAreaInset||{},content=tg?.contentSafeAreaInset||{};document.documentElement.style.setProperty('--safe-top',Math.max(0,(inset.top||0)+(content.top||0))+'px');document.documentElement.style.setProperty('--safe-bottom',Math.max(0,(inset.bottom||0)+(content.bottom||0))+'px')}
setupTelegram();syncViewport();window.addEventListener('resize',syncViewport,{passive:true});window.visualViewport?.addEventListener('resize',syncViewport,{passive:true});for(const event of ['viewportChanged','safeAreaChanged','contentSafeAreaChanged','fullscreenChanged'])try{tg?.onEvent(event,syncViewport)}catch{}
let toastTimer;function toast(message,type='info'){clearTimeout(toastTimer);const root=$('#toast-root');if(!root)return;root.innerHTML=`<div class="toast">${icon(type==='error'?'info':type==='success'?'check':'info')}<span>${esc(message)}</span></div>`;toastTimer=setTimeout(()=>root.replaceChildren(),4200);try{if(type==='success'||type==='error')tg?.HapticFeedback?.notificationOccurred(type)}catch{}}
async function request(path,body,options={}){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),options.timeout||22000);try{const response=await fetch(path,{method:body===undefined?'GET':'POST',credentials:'same-origin',cache:'no-store',headers:body===undefined?{'Accept':'application/json'}:{'Accept':'application/json','Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),signal:ctrl.signal});let data;try{data=await response.json()}catch{throw new Error('Сервер вернул непонятный ответ. Попробуйте проверить статус позже.')}if(!response.ok||data.ok===false)throw Object.assign(new Error(typeof data.error==='string'?data.error:typeof data.detail==='string'?data.detail:'Ошибка сервера ('+response.status+')'),{definite:true,status:response.status});return data}catch(e){if(e.name==='AbortError')throw new Error('Сервер не ответил вовремя. Проверьте соединение и статус операции.');if(e instanceof TypeError)throw new Error('Нет связи с сервером. Проверьте интернет.');throw e}finally{clearTimeout(timer)}}
function safeURL(raw){try{const url=new URL(String(raw));return ['https:','http:','tg:'].includes(url.protocol)?url:null}catch{return null}}
function assetURL(raw){if(!raw)return '';try{const u=new URL(raw,location.href);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function telegramURL(raw){const u=safeURL(raw);if(!u)return'';if(u.protocol==='tg:'&&u.hostname==='resolve'){const name=u.searchParams.get('domain');if(!name||!/^[A-Za-z0-9_]+$/.test(name))return'';const q=new URLSearchParams(u.searchParams);q.delete('domain');return'https://t.me/'+name+(q.size?'?'+q.toString():'')}return u.href}
function openExternal(raw){const url=safeURL(raw);if(!url){toast('Ссылка недоступна','error');return false}const tel=telegramURL(raw);try{if(tg?.initData&&/^https:\/\/(t\.me|telegram\.me)\//i.test(tel)&&tg.openTelegramLink){tg.openTelegramLink(tel);return true}if(tg?.initData&&url.protocol!=='tg:'&&tg.openLink){tg.openLink(url.href,{try_instant_view:false});return true}const a=document.createElement('a');a.href=tel||url.href;a.target='_blank';a.rel='noopener noreferrer';document.body.append(a);a.click();a.remove();return true}catch{toast('Не удалось открыть ссылку. Скопируйте её вручную.','error');return false}}
async function copyText(text,label='Ссылка скопирована'){if(!text)return toast('Ссылка пока недоступна','error');let done=false;try{await navigator.clipboard.writeText(text);done=true}catch{const input=document.createElement('textarea');input.value=text;input.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(input);input.select();try{done=document.execCommand('copy')}catch{}input.remove()}if(done)toast(label,'success');else if(typeof openSheet==='function')openSheet('copy','Скопировать ссылку','Выделите текст и скопируйте его вручную.',`<textarea class="field" readonly rows="4" aria-label="Ссылка">${esc(text)}</textarea>`);else toast('Браузер не разрешил копирование','error')}
function money(v){return Number(v||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽'}
function plural(n,a,b,c){n=Math.abs(n);return n%10===1&&n%100!==11?a:n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?b:c}
function parseServerDate(v){if(!v)return NaN;const s=String(v).trim();if(/^\d{2}\.\d{2}\.\d{4}$/.test(s)){const[d,m,y]=s.split('.');return Date.parse(`${y}-${m}-${d}T23:59:59+03:00`)}return Date.parse(s.replace(' ','T')+(/Z$|[+-]\d\d:\d\d$/.test(s)?'':'+03:00'))}
function dayLabel(n){return plural(n,'день','дня','дней')}
function loading(text='Загружаем…'){return `<div class="loader-inline" role="status"><i class="mini-spinner"></i>${esc(text)}</div>`}
function button(action,label,ico='',cls='',attrs=''){return `<button type="button" class="button ${cls}" data-action="${action}" ${attrs}>${ico?icon(ico):''}<span>${label}</span></button>`}
function row(action,ico,title,subtitle='',right=''){return `<button type="button" class="row card" data-action="${action}"><span class="tile-icon">${icon(ico)}</span><span class="grow"><h3>${title}</h3>${subtitle?`<p>${subtitle}</p>`:''}</span>${right||icon('chevron','chevron')}</button>`}
async function busy(el,task){if(el?.disabled)return;const content=el?.innerHTML;if(el){el.disabled=true;el.setAttribute('aria-busy','true');el.innerHTML='<i class="mini-spinner"></i>'}try{return await task()}catch(e){toast(e.message||'Не удалось выполнить действие','error')}finally{if(el?.isConnected){el.disabled=false;el.removeAttribute('aria-busy');el.innerHTML=content}}}
async function takeSecretScreenshot(){if(!navigator.mediaDevices?.getDisplayMedia)return toast('Снимок экрана доступен только в поддерживаемом браузере','error');let stream;try{stream=await navigator.mediaDevices.getDisplayMedia({video:{cursor:'never'},audio:false});const video=document.createElement('video');video.muted=true;video.srcObject=stream;await video.play();const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);stream.getTracks().forEach(t=>t.stop());const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));if(!blob)throw new Error('Не удалось создать снимок');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='screenshot_'+Date.now()+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob})])}catch{}toast('Снимок сохранён','success')}catch(e){if(e.name!=='NotAllowedError')toast(e.message,'error')}finally{stream?.getTracks().forEach(t=>t.stop())}}
let secretSequence='';document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;secretSequence=/^\d$/.test(e.key)?(secretSequence+e.key).slice(-4):'';if(secretSequence==='3350'){secretSequence='';takeSecretScreenshot()}});

'use strict';
const authBrand=$('#brand-source').textContent.trim(),authLogo=$('#logo-source').getAttribute('src')||'';
let authMode='loading',authBusy=false,authPollTimer=null,authPollBusy=false,authRequest=null,authError='',authNotice='',resetEmail='',resetCode='',resetExpiry=0,resetTimer=null,emailDraft='',resetAttempt=0;
function loginBrand(){return `<div class="brand">${assetURL(authLogo)?`<img src="${esc(authLogo)}" alt="" decoding="async">`:''}<strong class="brand-name">${esc(authBrand||'VPN')}</strong></div>`}
$('#login-brand').innerHTML=loginBrand();
function authHeading(title,back='methods'){return `<div class="auth-back"><button type="button" class="round" data-auth-page="${back}" aria-label="Назад">${icon('back')}</button><h2>${title}</h2></div>`}
function passwordField(id,label='Пароль',autocomplete='current-password'){return `<label class="field-label" for="${id}">${label}</label><div class="password-field"><input class="field" id="${id}" type="password" autocomplete="${autocomplete}" required maxlength="256" placeholder="${label}"><button type="button" class="round" data-show-password="${id}" aria-label="Показать пароль">${icon('shield')}</button></div>`}
function renderAuth(){const root=$('#auth-content');root.className='auth-content enter';const notice=authNotice?`<div class="auth-notice" role="status">${esc(authNotice)}</div>`:'';const error=`<div class="auth-error" id="auth-error" role="alert">${esc(authError)}</div>`;
if(authMode==='loading'){root.innerHTML=`<div class="auth-loading"><div class="payment-spinner"></div><h2>Готовим кабинет</h2><p>Проверяем доступ к вашим подпискам.</p></div>`;return}
if(authMode==='methods'){root.innerHTML=`${notice}<div class="login-hero"><div class="login-symbol">${assetURL(authLogo)?`<img src="${esc(authLogo)}" alt="">`:icon('shield')}</div><h1>Ваш доступ.<br>Всё под контролем.</h1><p>Войдите в кабинет, чтобы подключить VPN и управлять подписками.</p></div><div class="auth-options">${button('telegram-login','Войти через Telegram','telegram','primary full')}${button('email-login','Войти по Email','user','secondary full')}${button('subscription-login','Войти по ссылке подписки','link','secondary full')}</div>${error}${authRequest?'<div class="auth-status"><span class="status-dot"></span>Ждём подтверждения в Telegram</div>':''}`;return}
if(authMode==='email'||authMode==='register'){const reg=authMode==='register';root.innerHTML=`${authHeading(reg?'Создать аккаунт':'Вход по Email')}${notice}<form class="auth-form" id="email-form"><p>${reg?'Создайте аккаунт для управления подписками.':'Введите данные вашего аккаунта.'}</p><label class="field-label" for="email-input">Email</label><input class="field" id="email-input" type="email" inputmode="email" autocomplete="email" value="${esc(emailDraft)}" placeholder="you@example.com" required maxlength="254">${passwordField('password-input','Пароль',reg?'new-password':'current-password')}${reg?'<p class="tiny mt">Минимум 5 символов, не только цифры.</p>':''}${error}<button type="submit" class="button primary full">${reg?'Создать аккаунт':'Войти'}</button><div class="auth-links"><button type="button" data-auth-page="${reg?'email':'register'}">${reg?'Уже есть аккаунт':'Создать аккаунт'}</button>${!reg?'<button type="button" data-auth-page="reset">Забыли пароль?</button>':''}</div></form>`;return}
if(authMode==='subscription'){root.innerHTML=`${authHeading('Вход по ключу')}<form class="auth-form" id="subscription-form"><p>Вставьте ссылку своей подписки. Откроется аккаунт, которому принадлежит ключ.</p><label class="field-label" for="subscription-input">Ссылка подписки</label><input class="field" id="subscription-input" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://…" required maxlength="2048">${error}<button class="button primary full" type="submit">Войти в кабинет</button></form>`;return}
if(authMode==='reset'){root.innerHTML=`${authHeading('Восстановление','email')}<form class="auth-form" id="reset-request-form"><p>Код придёт в Telegram, привязанный к вашему аккаунту.</p><label class="field-label" for="reset-email">Email аккаунта</label><input class="field" id="reset-email" type="email" inputmode="email" autocomplete="email" value="${esc(resetEmail||emailDraft)}" placeholder="you@example.com" required maxlength="254">${error}<button class="button primary full" type="submit">Получить код в Telegram</button></form>`;return}
if(authMode==='code'){root.innerHTML=`${authHeading('Код из Telegram','reset')}<form class="auth-form" id="reset-code-form"><p>Введите 6 цифр из сообщения бота.<br>Аккаунт: <strong>${esc(resetEmail)}</strong></p><label class="field-label" for="reset-code">Код подтверждения</label><input id="reset-code" class="field code-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" aria-label="Код подтверждения" required><div class="reset-countdown" id="reset-countdown"></div>${error}<button class="button primary full" type="submit">Проверить код</button><button type="button" class="auth-secondary" data-auth-page="reset">Запросить новый код</button></form>`;tickReset();return}
if(authMode==='new-password'){root.innerHTML=`${authHeading('Новый пароль','email')}<form class="auth-form" id="reset-verify-form"><p>Код подтверждён. Задайте новый пароль для аккаунта.</p>${passwordField('reset-password','Новый пароль','new-password')}<p class="tiny mt">Минимум 5 символов, не только цифры.</p>${error}<button class="button primary full" type="submit">Сохранить пароль</button></form>`}}
function setAuthMode(mode){if(authBusy)return;if($('#email-input'))emailDraft=$('#email-input').value.trim();authMode=mode;authError='';authNotice='';renderAuth();try{mode==='methods'?tg?.BackButton?.hide():tg?.BackButton?.show()}catch{}}
function showAuthError(message){authError=message;if($('#auth-error'))$('#auth-error').textContent=message;else{authMode='methods';renderAuth()}}
function validPassword(p){if(p.length<5)return'Пароль должен содержать минимум 5 символов';if(/^\d+$/.test(p))return'Пароль не должен состоять только из цифр';if(new Set(p).size<2)return'Используйте разные символы в пароле';return''}
async function runAuth(el,fn){if(authBusy)return;authBusy=true;authError='';if($('#auth-error'))$('#auth-error').textContent='';const old=el?.innerHTML;if(el){el.disabled=true;el.innerHTML='<i class="mini-spinner"></i>'}try{await fn()}catch(e){showAuthError(e.message||'Не удалось выполнить вход')}finally{authBusy=false;if(el?.isConnected){el.disabled=false;el.innerHTML=old}}}
function loginWithToken(token){if(!token)throw new Error('Сервер не вернул токен входа');clearTimeout(authPollTimer);setAuthToken(token);location.replace('/?token='+encodeURIComponent(token))}
async function tryTelegramLogin(){if(!tg?.initDataUnsafe?.user?.id)return false;if(tg.initData){try{const d=await request('/api/auth/token',{init_data:tg.initData});if(d.token){loginWithToken(d.token);return true}}catch{}}try{const d=await request('/api/auth/telegram-direct',{user_id:tg.initDataUnsafe.user.id});if(d.token){loginWithToken(d.token);return true}}catch{}return false}
async function beginTelegram(el){await runAuth(el,async()=>{if(await tryTelegramLogin())return;if(!authRequest||Date.now()-authRequest.started>9*60000){const d=await request('/api/auth/request-token');if(!d.token||!safeURL(d.auth_url))throw new Error('Не удалось получить ссылку входа');authRequest={token:d.token,url:d.auth_url,started:Date.now()}}openExternal(authRequest.url);authMode='methods';renderAuth();scheduleAuthPoll(1000)})}
function scheduleAuthPoll(ms=2200){clearTimeout(authPollTimer);if(authRequest&&!document.hidden)authPollTimer=setTimeout(pollAuth,ms)}
async function pollAuth(){if(!authRequest||authPollBusy||document.hidden)return;if(Date.now()-authRequest.started>600000){authRequest=null;if(authMode==='methods'){authError='Время ожидания истекло. Нажмите «Войти через Telegram» ещё раз.';renderAuth()}return}authPollBusy=true;try{const d=await request('/api/auth/check-token/'+encodeURIComponent(authRequest.token));if(d.authorized&&d.token){loginWithToken(d.token);return}}catch{/* Keep the same challenge through transient read errors. */}finally{authPollBusy=false;scheduleAuthPoll()}}
function tickReset(){const el=$('#reset-countdown');if(!el)return;const n=Math.max(0,Math.ceil((resetExpiry-Date.now())/1000));el.textContent=n?'Код действует ещё '+Math.floor(n/60)+':'+String(n%60).padStart(2,'0'):'Срок кода истёк. Запросите новый код.'}
async function checkReset(el){const value=$('#reset-code')?.value.replace(/\D/g,'')||'';if(value.length!==6)return showAuthError('Введите 6 цифр');await runAuth(el,async()=>{await request('/api/auth/email/reset/check',{email:resetEmail,code:value});resetCode=value;authMode='new-password';clearInterval(resetTimer);renderAuth()})}
document.addEventListener('click',async e=>{const el=e.target.closest('button');if(!el||el.disabled)return;if(el.dataset.authPage){setAuthMode(el.dataset.authPage);return}if(el.dataset.showPassword){const input=document.getElementById(el.dataset.showPassword);input.type=input.type==='password'?'text':'password';el.setAttribute('aria-label',input.type==='password'?'Показать пароль':'Скрыть пароль');return}if(el.dataset.action==='telegram-login')await beginTelegram(el);if(el.dataset.action==='email-login')setAuthMode('email');if(el.dataset.action==='subscription-login')setAuthMode('subscription')});
document.addEventListener('submit',async e=>{e.preventDefault();const form=e.target,el=e.submitter;if(form.id==='email-form'){const email=$('#email-input').value.trim(),password=$('#password-input').value;emailDraft=email;const reg=authMode==='register',error=reg?validPassword(password):'';if(error)return showAuthError(error);await runAuth(el,async()=>{const d=await request('/api/auth/email/'+(reg?'register':'login'),{email,password});loginWithToken(d.token)})}else if(form.id==='subscription-form'){const subscription_url=$('#subscription-input').value.trim();await runAuth(el,async()=>{const d=await request('/api/auth/subscription',{subscription_url});loginWithToken(d.token)})}else if(form.id==='reset-request-form'){resetEmail=$('#reset-email').value.trim();await runAuth(el,async()=>{await request('/api/auth/email/reset/request',{email:resetEmail});resetCode='';resetExpiry=Date.now()+600000;authMode='code';renderAuth();clearInterval(resetTimer);resetTimer=setInterval(tickReset,1000)})}else if(form.id==='reset-code-form'){await checkReset(el)}else if(form.id==='reset-verify-form'){const new_password=$('#reset-password').value,error=validPassword(new_password);if(error)return showAuthError(error);await runAuth(el,async()=>{await request('/api/auth/email/reset/verify',{email:resetEmail,code:resetCode,new_password});resetCode='';emailDraft=resetEmail;authNotice='Пароль изменён. Войдите с новым паролем.';authMode='email';renderAuth()})}});
document.addEventListener('input',e=>{if(e.target.id==='reset-code')e.target.value=e.target.value.replace(/\D/g,'').slice(0,6)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(authPollTimer);else scheduleAuthPoll(100)});
try{tg?.BackButton?.onClick(()=>setAuthMode(['reset','new-password'].includes(authMode)?'email':authMode==='code'?'reset':'methods'))}catch{}
async function initAuth(){renderAuth();const url=new URL(location.href),incoming=url.searchParams.get('token');if(incoming){setAuthToken(incoming);url.searchParams.delete('token');history.replaceState(null,'',url.pathname+url.search)}const saved=getAuthToken();if(saved){try{const d=await request('/api/auth/check-token/'+encodeURIComponent(saved));if(d.authorized){loginWithToken(d.token||saved);return}removeAuthToken()}catch(e){authNotice='Не удалось проверить сохранённый вход. Выберите способ авторизации.'}}if(!url.searchParams.has('logged_out')&&await tryTelegramLogin())return;authMode='methods';renderAuth();try{tg?.BackButton?.hide()}catch{}}
initAuth();
</script></body></html>
